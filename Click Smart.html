<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click Smart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C0F2E;--blue:#2338FF;--bg:#F7F7FB;--ink:#0C0F2E;--mute:#454B75;--panel:#FFFFFF;--line:#C9CCE6;--pink:#FF4FA3;--yel:#FFD93D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C24;--ink:#EEF0FF;--mute:#A4AAD6;--panel:#14173A;--line:#2B3070}}
:root[data-theme="dark"]{--bg:#0A0C24;--ink:#EEF0FF;--mute:#A4AAD6;--panel:#14173A;--line:#2B3070}
*{box-sizing:border-box}
html{scroll-padding-top:64px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"JetBrains Mono","IBM Plex Sans",sans-serif;margin:0 0 .5em;line-height:1.1;font-weight:700}
h1{font-size:clamp(1.9rem,5.6vw,3.7rem);font-weight:800;letter-spacing:-.04em;overflow-wrap:break-word}h2{font-size:clamp(1.6rem,4.2vw,2.5rem);letter-spacing:-.03em;overflow-wrap:break-word}h3{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 1em;max-width:62ch}a{color:inherit}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff}
nav .wrap{display:flex;gap:4px 18px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
nav .brand{font:700 1.15rem "JetBrains Mono",sans-serif;margin-right:auto;color:var(--yel);text-decoration:none;border:0}
nav a{text-decoration:none;font-weight:600;font-size:.92rem;padding:4px 0;border-bottom:3px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-color:var(--pink)}
nav .brand:hover{border-color:transparent}
nav .brand::before{content:"";display:inline-block;width:13px;height:18px;background:var(--yel);clip-path:polygon(0 0,0 100%,28% 76%,48% 100%,62% 92%,43% 68%,80% 68%);margin-right:9px;vertical-align:-3px}
#lang{font:600 .9rem "IBM Plex Sans",sans-serif;background:var(--yel);color:var(--navy);border:0;padding:5px 10px;cursor:pointer}
.btn{display:inline-block;font:600 1rem "IBM Plex Sans",sans-serif;text-decoration:none;color:var(--navy);background:var(--yel);padding:13px 22px;border:3px solid var(--navy);box-shadow:5px 5px 0 var(--navy);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--navy)}
.btn.w{background:#fff}
.hero{background-color:var(--blue);background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:28px 28px;color:#fff;padding:56px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:center}
.hero p{font-size:1.2rem;color:#E4E7FF}
.ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px}
.win{background:#fff;color:var(--navy);border:3px solid var(--navy);box-shadow:10px 10px 0 var(--navy);font-size:.97rem}
.win header{background:var(--navy);color:#fff;padding:7px 12px;display:flex;align-items:center;gap:8px;font:500 1rem "JetBrains Mono",sans-serif}
.win header i{width:11px;height:11px;background:var(--pink);display:inline-block}.win header i+i{background:var(--yel)}
.win header span{margin-left:6px}
.rows{margin:0;padding:6px 14px 0}
.row{display:grid;grid-template-columns:105px 1fr;gap:2px 12px;padding:9px 0;border-bottom:1px solid #D9DBEE;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.row.in{opacity:1;transform:none}
.row dt{color:#454B75;font-weight:600}.row dd{margin:0;font-weight:600;word-break:break-word}
.row dd small{display:block;font-weight:400;color:#454B75}
.win footer{padding:11px 14px;background:#FFF4B8;font-weight:600;font-size:.92rem}
section{padding:72px 0}
.lead{font-size:1.15rem;color:var(--mute)}
.dark{background:var(--navy);color:#EEF0FF}.dark .lead{color:#B8BDEA}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:26px}
.door{display:block;text-decoration:none;border:3px solid var(--ink);background:var(--panel);padding:20px;transition:transform .08s,box-shadow .08s}
.door:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--blue)}
.door h3{margin-bottom:.35em}.door p{color:var(--mute);margin:0;font-size:.97rem}
.door span{display:inline-block;margin-top:12px;font-weight:600;border-bottom:3px solid var(--pink)}
.school{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;border:3px solid var(--ink);background:var(--panel);padding:24px;box-shadow:8px 8px 0 var(--pink)}
.logo{width:130px;height:130px;border:3px dashed var(--line);display:grid;place-items:center;text-align:center;font:500 1.05rem "JetBrains Mono",sans-serif;color:var(--mute);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.school p{margin:0;color:var(--mute)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
#cyc{width:100%;max-width:430px;height:auto;display:block;margin:0 auto}
#cyc .ring{fill:none;stroke:#3B4190;stroke-width:3;stroke-dasharray:4 8}
#cyc .n{cursor:pointer}#cyc .n rect{fill:#14173A;stroke:#8E96FF;stroke-width:3}
#cyc .n:hover rect{stroke:var(--yel)}
#cyc .n.on rect{fill:var(--yel);stroke:var(--yel)}#cyc .n.on text{fill:var(--navy)}
#cyc text{fill:#fff;font:500 14px "JetBrains Mono",sans-serif;text-anchor:middle;pointer-events:none}
#cyc .pk{fill:var(--pink)}
#detail{border:3px solid #8E96FF;padding:16px 18px;margin-top:14px;min-height:9em}
#detail h3{color:var(--yel);margin-bottom:.3em}#detail p{margin:0;color:#D5D9FF}
.facts{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.facts li{border-left:4px solid var(--pink);padding-left:14px}
.facts b{display:block;font:500 1.15rem "JetBrains Mono",sans-serif;color:var(--yel)}
.page{padding:56px 0 90px;min-height:70vh}
.status{border:3px solid var(--ink);background:var(--panel);box-shadow:8px 8px 0 var(--ink);padding:26px;max-width:740px;margin-top:26px}
.status h3{margin-bottom:.3em}.status p{color:var(--mute);margin:0}
.tag{display:inline-block;background:var(--pink);color:var(--navy);font:500 1rem "JetBrains Mono",sans-serif;padding:2px 10px;margin-bottom:14px}
.bars{display:grid;gap:14px;margin-top:30px;max-width:740px}
.bar{display:grid;grid-template-columns:minmax(150px,260px) 1fr 52px;gap:14px;align-items:center}
.bar i{display:block;height:20px;background:var(--line)}.bar i span{display:block;height:100%;background:var(--blue)}
.pad{height:180px;margin-top:26px;border:3px dashed #3B4190;display:grid;place-items:center;color:#B8BDEA;font:500 1.3rem "JetBrains Mono",sans-serif;max-width:740px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}
.tools input{flex:1 1 240px;font:inherit;padding:12px 14px;border:3px solid var(--ink);background:var(--panel);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:600 .92rem "IBM Plex Sans",sans-serif;padding:9px 14px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
#entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
details{border:3px solid var(--ink);background:var(--panel);padding:14px 16px;align-self:start}
details[open]{box-shadow:6px 6px 0 var(--blue)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;font:500 1.2rem "JetBrains Mono",sans-serif}
summary::-webkit-details-marker{display:none}summary::after{content:"+"}details[open] summary::after{content:"-"}
details p{margin:10px 0 0;color:var(--mute);font-size:.98rem}
details h4{margin:16px 0 6px;font:500 1.05rem "JetBrains Mono",sans-serif;color:var(--blue)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) details h4{color:var(--yel)}}
details ul{margin:0;padding-left:20px;font-size:.98rem}details li{margin-bottom:5px}
.help{background:#FFF4B8;color:var(--navy);padding:10px 12px;margin-top:14px;font-size:.95rem;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:26px 0 40px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border:3px solid var(--ink);background:var(--panel);padding:16px}
.steps li::before{content:counter(s);display:inline-block;background:var(--yel);color:var(--navy);font:700 1.2rem "JetBrains Mono",sans-serif;padding:0 10px;margin-bottom:8px}
.steps b{display:block}.steps span{color:var(--mute);font-size:.96rem}
.contacts{display:grid;gap:16px}
.contact{display:grid;grid-template-columns:190px 1fr;gap:20px;border:3px solid var(--ink);background:var(--panel);padding:18px}
.contact .num{font:700 1.35rem "JetBrains Mono",sans-serif;color:var(--blue);line-height:1.1;text-decoration:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact .num{color:var(--yel)}}
.contact h3{margin-bottom:.2em}.contact p{margin:0 0 .4em;color:var(--mute)}
.contact a.l{font-weight:600;margin-right:14px}
.contact.urgent{background:#FFF4B8;color:var(--navy)}.contact.urgent p{color:#33385E}.contact.urgent .num{color:var(--navy)}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:28px}
.poster{border:3px solid var(--ink);background:var(--panel);box-shadow:6px 6px 0 var(--ink);margin:0}
.poster img{display:block;width:100%;height:auto}
.poster.ph{aspect-ratio:3/4;display:grid;place-items:center;border-style:dashed;box-shadow:none;color:var(--mute);font:500 1.1rem "JetBrains Mono",sans-serif;text-align:center;padding:12px}
.poster figcaption{padding:10px 12px;font-weight:600;font-size:.95rem}
footer.site{padding:28px 0;color:var(--mute);font-size:.92rem;border-top:1px solid var(--line)}
@media(max-width:820px){.hero .wrap,.split{grid-template-columns:1fr}section{padding:56px 0}.row{grid-template-columns:1fr}.bar{grid-template-columns:1fr 48px}.bar i{grid-column:1/2;grid-row:2}.win{box-shadow:6px 6px 0 var(--navy)}.school,.contact{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.row{transition:none}}
</style>
</head>

 const g=el("g",{class:"n",tabindex:0,role:"button"});el("rect",{x:x-42,y:y-22,width:84,height:44},g);
 labels.push(el("text",{x:x,y:y+5},g));nodes.push(g);
 g.onclick=()=>press(i);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();press(i)}}}
const pk=el("rect",{class:"pk",width:12,height:12});
let ang=0,stopAt=null,sel=null;
function place(){const a=(ang-90)*Math.PI/180;pk.setAttribute("x",200+140*Math.cos(a)-6);pk.setAttribute("y",200+140*Math.sin(a)-6)}
function press(i){
 if(sel===i){sel=null;stopAt=null}else{sel=i;stopAt=i*72;if(sr){ang=stopAt}}
 showDetail();place();
}
function showDetail(){
 nodes.forEach((n,k)=>n.classList.toggle("on",k===sel));
 det.innerHTML="<h3></h3><p></p>";
 if(sel===null){det.firstChild.textContent="";det.lastChild.textContent=t("hint")}
 else{const s=t("stages")[sel];det.firstChild.textContent=s[1];det.lastChild.textContent=s[2]}
}
function buildStages(){t("stages").forEach((s,i)=>{labels[i].textContent=s[0];nodes[i].setAttribute("aria-label",s[1])});svg.setAttribute("aria-label",t("cycLabel"));showDetail()}
const SPD=.45;
(function frame(){
 if(!sr){
  if(stopAt===null)ang=(ang+SPD)%360;
  else{const diff=((stopAt-ang)%360+360)%360;ang=diff<=SPD?stopAt:(ang+SPD)%360}
 }
 place();requestAnimationFrame(frame)})();

/* ===== Survey ===== */
function buildSurvey(){const b=$("bars");b.innerHTML="";
 if(!SURVEY.length)return;$("resStatus").hidden=true;
 SURVEY.forEach(r=>{const d=document.createElement("div");d.className="bar";d.innerHTML="<b></b><i><span></span></i><span></span>";
  d.children[0].textContent=r[lang]||r.en;d.children[1].firstChild.style.width=r.pct+"%";d.children[2].textContent=r.pct+"%";b.appendChild(d)})}

/* ===== Encyclopedia ===== */
let topic="all";
function buildChips(){const c=$("chips");c.innerHTML="";
 ["all",...new Set(WIKI.map(w=>w.c))].forEach(k=>{const b=document.createElement("button");b.textContent=k==="all"?t("all"):t("cat")[k];b.setAttribute("aria-pressed",k===topic);
  b.onclick=()=>{topic=k;buildChips();render()};c.appendChild(b)})}
function render(){const k=$("q").value.trim().toLowerCase(),list=$("entries");list.innerHTML="";
 const r=WIKI.filter(w=>(topic==="all"||w.c===topic)&&(w[lang].t+w[lang].d).toLowerCase().includes(k));
 r.forEach(w=>{const x=w[lang],d=document.createElement("details");
  d.innerHTML="<summary></summary><p></p><h4></h4><ul></ul><div class='help'></div>";
  d.children[0].textContent=x.t;d.children[1].textContent=x.d;d.children[2].textContent=t("prev");
  x.p.forEach(s=>{const li=document.createElement("li");li.textContent=s;d.querySelector("ul").appendChild(li)});
  d.querySelector(".help").textContent=t("ifh")+x.h;list.appendChild(d)});
 $("none").hidden=r.length>0}
$("q").oninput=render;

/* ===== Help ===== */
function buildHelp(){
 const st=$("steps");st.innerHTML="";
 t("steps").forEach(s=>{const li=document.createElement("li");li.innerHTML="<b></b><span></span>";li.children[0].textContent=s[0];li.children[1].textContent=s[1];st.appendChild(li)});
 const c=$("contacts");c.innerHTML="";
 t("contacts").forEach(x=>{const d=document.createElement("div");d.className="contact"+(x.u?" urgent":"");
  const n=document.createElement(x.tel?"a":"div");n.className="num";n.textContent=x.n;if(x.tel)n.href="tel:"+x.tel;
  const b=document.createElement("div");b.innerHTML="<h3></h3><p></p>";b.children[0].textContent=x.t;b.children[1].textContent=x.p;
  (x.l||[]).forEach(l=>{const a=document.createElement("a");a.className="l";a.textContent=l[0];a.href=l[1];if(l[1].startsWith("http")){a.target="_blank";a.rel="noopener noreferrer"}b.appendChild(a)});
  d.append(n,b);c.appendChild(d)})}

/* ===== Campaign ===== */
function buildPosters(){const p=$("posters");p.innerHTML="";
 if(POSTERS.length)POSTERS.forEach(x=>{const f=document.createElement("figure");f.className="poster";const im=new Image();im.src=x.src;im.alt=x[lang]||x.en||"";f.appendChild(im);
  const c=document.createElement("figcaption");c.textContent=x[lang]||x.en||"";f.appendChild(c);p.appendChild(f)});
 else for(let i=0;i<3;i++){const f=document.createElement("div");f.className="poster ph";f.textContent=t("soon");p.appendChild(f)}}

applyLang();route(true);
</script>
</body>
